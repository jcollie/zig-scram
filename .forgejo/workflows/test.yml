name: test

# The workflow has to be on the default branch for the manual trigger to show
# up in the UI, where it appears as a "Run workflow" button on the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    # An ephemeral DigitalOcean droplet running NixOS, so nix is already there
    # and the toolchain comes from the flake rather than from an install step:
    # one definition of what this project is built with, shared by the shell it
    # is developed in and the job that checks it.
    runs-on: nixos-do-s

    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every file needs an SPDX header and every license a file in LICENSES/,
      # which is easy to forget when adding one.
      - name: Check REUSE compliance
        run: nix develop -c reuse lint

      - name: Check Zig formatting compliance
        run: nix develop -c zig fmt --check .

      # As a developer runs them: the devshell's Zig, fetching uucode over the
      # network the way `zig build` does outside of Nix.
      - name: Test
        run: nix develop -c zig build test --summary all

      # And as Nix builds them: the package, with no network and uucode coming
      # from the generated build.zig.zon.nix, so that a dependency added to
      # build.zig.zon without regenerating that file fails here rather than at
      # the next release. Its check phase runs the suite a second time, in the
      # sandbox, and this also evaluates the devshell.
      - name: Check the flake
        run: nix flake check --print-build-logs
