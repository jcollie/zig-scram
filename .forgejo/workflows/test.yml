name: test

# The workflow has to be on the default branch for the manual trigger to show
# up in the UI, where it appears as a "Run workflow" button on the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    # One of Codeberg's hosted runners: 2 CPUs, 4G, and a 5 minute limit.
    # See https://codeberg.org/actions/meta for the rest of the labels.
    runs-on: codeberg-small

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      # Every file needs an SPDX header and every license a file in LICENSES/,
      # which is easy to forget when adding one. reuse is a Python tool and the
      # runner image ships pipx, so no install step of its own is needed. The
      # major version is pinned so that a new REUSE specification cannot turn
      # this red without a change here.
      - name: Check REUSE compliance
        run: pipx run --spec 'reuse>=6,<7' reuse lint

      # Codeberg resolves bare action names against code.forgejo.org, so this
      # one needs its full URL. With no version input it installs the
      # minimum_zig_version from build.zig.zon, which is the version worth
      # testing against, and it caches Zig's global cache itself — that is
      # where the uucode fetch and its generated Unicode tables live.
      - uses: https://github.com/mlugg/setup-zig@v2

      - name: Run the tests
        run: |
          zig version
          zig build test --summary all
