version = 1

# Files that cannot carry a header of their own: flake.lock is JSON, and
# build.zig.zon.nix is written by zon2nix, which would drop anything added to
# it by hand the next time a dependency moved.
[[annotations]]
path = ["flake.lock", "build.zig.zon.nix"]
precedence = "aggregate"
